# Jetway's committed defaults. JETWAY__* environment variables override any value here
# (`JETWAY__SERVER__PORT=9000` sets server.port). Later phases add their sections; see docs/plan/README.md §5.

[server]
host = "127.0.0.1"
port = 8300                        # gateway: Ollama and OpenAI-compatible APIs
admin_port = 8301                  # dashboard, admin API, /metrics
max_request_bytes = 67_108_864     # 64 MiB; image inputs are base64
shutdown_grace_seconds = 30
require_known_app = false          # true: apps not listed under [apps] get 403

[upstream]
name = "ollama"
url = "http://127.0.0.1:11434"     # 127.0.0.1, never localhost (Windows tries ::1 first)
connect_timeout_ms = 2000
first_byte_timeout_seconds = 600   # long prompts on a busy GPU
idle_timeout_seconds = 120         # longest silence between stream chunks
slots = 1                          # requests sent at once (phase 9)

[store]
path = "data/jetway.db"
bodies = "all"                     # none | errors | all (zstd-compressed)
retention_days = 7                 # exchanges and bodies; 0 keeps them forever
rollup_retention_days = 90         # per-minute rollups for history charts

[cache]                            # per app: [apps.<name>.cache] with exact, sampled, replay, join
exact = true
shared = false                     # true: apps share entries
max_memory_bytes = 268_435_456     # 256 MiB in memory; everything is also kept in SQLite until it expires
ttl_hours = 168
sampled = "allow"                  # allow | skip: requests with temperature > 0 (or the model's default) and no seed
replay = "instant"                 # instant | paced (cached streams at the original token rate)
join = true                        # identical requests in flight share one upstream call

[queue]                            # phase 9; per app: priority = "interactive" | "normal" | "batch"
max_wait_seconds = { interactive = 30, normal = 120, batch = 900 }
aging_seconds = 30                 # a waiting request moves up one class per 30 s waited

[budgets]                          # per app: requests_per_minute, burst, requests_per_day, tokens_per_day,
time_zone = "system"               # tokens_per_month, gpu_seconds_per_day, max_output_tokens; days start here

[health]
probe_seconds = 5                  # GET /api/version on the upstream
failures_to_open = 3               # failed connects in a row that open the circuit (fail fast with 503)

[alerts]
enabled = true
error_rate = 0.05                  # upstream errors and timeouts over 5 minutes, per app
min_requests = 20
ttft_p95_ms = 15_000
cooldown_minutes = 15
telegram = false                   # needs JETWAY_TELEGRAM_TOKEN and JETWAY_TELEGRAM_CHAT_ID (environment or .env)
telegram_api = "https://api.telegram.org"

[otel]
endpoint = ""                      # e.g. "http://127.0.0.1:8200" (BlackBox) or the Aspire dashboard's OTLP/HTTP port
service_name = "jetway"
