# cargo-deny: licences, RustSec advisories, duplicate crates and crate sources (plan §0.4).

[advisories]
yanked = "deny"
ignore = [
  # basic-toml is unmaintained (not vulnerable). It is only used at compile time by askama_derive to read askama's
  # own configuration, so nothing at run time parses TOML with it. Drop this once askama moves off it.
  { id = "RUSTSEC-2026-0374", reason = "build-time only, through askama_derive; no maintained askama without it yet" },
]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
  "0BSD",
]
confidence-threshold = 0.9
# Later phases bring crates under these licences (ONNX Runtime, tokenizers, webpki roots).
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
