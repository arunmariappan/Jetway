[package]
name = "jetway"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "An LLM gateway in front of Ollama: streaming pass-through, caches, guards, routing, budgets and a live dashboard"
license = "MIT OR Apache-2.0"
repository = "https://github.com/arunmariappan/Jetway"
publish = false

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
figment = { version = "0.10.19", features = ["toml", "env"] }
futures = "0.3.34"
http-body-util = "0.1.5"
jiff = "0.2.38"
reqwest = { version = "0.13.5", default-features = false, features = ["stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = "0.7.20"
toml = "1.1.8"
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["trace", "limit"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ulid = "3.0.0"

[dev-dependencies]
figment = { version = "0.10.19", features = ["toml", "env", "test"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"

# Dependencies are optimised even in debug builds, so ONNX Runtime, regex and compression aren't painfully slow.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
