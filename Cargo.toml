[package]
name = "jetway"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "An LLM gateway in front of Ollama: streaming pass-through, caches, guards, routing, budgets and a live dashboard"
license = "MIT OR Apache-2.0"
repository = "https://github.com/arunmariappan/Jetway"
publish = false

[dependencies]
anyhow = "1.0.104"
askama = "0.16.1"
askama_web = { version = "0.16.0", features = ["axum-0.8"] }
axum = "0.8.9"
blake3 = "1.8.7"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
figment = { version = "0.10.19", features = ["toml", "env"] }
futures = "0.3.34"
governor = "0.10.4"
hdrhistogram = "7.6.0"
http-body-util = "0.1.5"
jiff = "0.2.38"
memory-stats = "1.2.0"
moka = { version = "0.12.16", features = ["sync"] }
opentelemetry-proto = { version = "0.33.1", default-features = false, features = ["gen-tonic-messages", "trace"] }
prost = "0.14.4"
rand = { version = "0.10.3", features = ["std_rng"] }
reqwest = { version = "0.13.5", default-features = false, features = ["stream", "rustls"] }
rusqlite = { version = "0.41.0", features = ["bundled"] }
rust-embed = { version = "8.13.0", features = ["include-exclude"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = "0.7.20"
toml = "1.1.8"
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["trace", "limit"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ulid = "3.0.0"
zstd = "0.14.3"

[dev-dependencies]
figment = { version = "0.10.19", features = ["toml", "env", "test"] }
opentelemetry-proto = { version = "0.33.1", default-features = false, features = ["gen-tonic-messages", "trace"] }
proptest = "1.12.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["full", "test-util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"

# Dependencies are optimised even in debug builds, so ONNX Runtime, regex and compression aren't painfully slow.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1

[[bench]]
name = "overhead"
harness = false
